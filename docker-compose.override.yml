services:
  minio:
    # Official minio/minio images were removed from Docker Hub/Quay.
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: myminiokeythatishouldchange123

  createbuckets:
    image: bitnamilegacy/minio-client:latest
    entrypoint: >
      /bin/sh -c "
      until /opt/bitnami/minio-client/bin/mc alias set vitryne http://minio:9000 minio myminiokeythatishouldchange123; do sleep 1; done;
      /opt/bitnami/minio-client/bin/mc mb -p vitryne/clips;
      exit 0;
      "

  vitryne:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitryne:local
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      FFMPEG_QUALITY_PRESETS: "640x360-30@1,854x480-60@2.5,1280x720-60@4,1920x1080-60@8,1920x1080-120@15,1920x1080-240@30,2560x1440-120@35,2560x1440-240@60"
